[project]
name = "neira-code-analyzer"
version = "0.1.0"
description = "MCP server for Neira Code Analyzer - advanced codebase analysis with professional templates"
authors = [
    { name = "Olivier D'Ancona", email = "olivier.dancona@master.hes-so.ch" },
]
dependencies = [
    "mcp>=1.9.0",
    "httpx>=0.28.1",
    "colorlog>=6.9.0",
    "code2prompt-rs>=3.2.1",
    # Neira API library (currently using google-genai as backend)
    "google-genai>=1.19.0",
    "python-dotenv>=1.0.0",
    # ИСПРАВЛЕНО: Добавлен aiofiles для асинхронного чтения файлов
    "aiofiles>=24.1.0",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.rye.scripts]
# ИСПРАВЛЕНО: Центральная команда запуска для устранения дублирования
serve = "python -m src.neira_code_analyzer.main"
debug = "python -m src.neira_code_analyzer.main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/neira_code_analyzer"]

[dependency-groups]
dev = [
    # Тестирование
    "aioresponses>=0.7.8",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "responses>=0.25.7",
    
    # Качество кода - ИСПРАВЛЕНО: Quick Wins для CI/CD
    "ruff>=0.8.4",           # Замена flake8 + black + isort
    "mypy>=1.13.0",          # Проверка типов
    
    # Безопасность - ИСПРАВЛЕНО: Сканирование зависимостей
    "pip-audit>=2.7.3",     # Аудит уязвимостей
    "bandit>=1.8.0",        # Сканирование кода на уязвимости
]

# 🔧 ИСПРАВЛЕНО: Конфигурация инструментов в pyproject.toml
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=src/neira_code_analyzer",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=34",  # Минимальное покрытие 34% (реалистично для текущего состояния)
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # assert statements (used in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "S101",  # assert statements in tests
    "S105",  # hardcoded passwords in tests
    "S106",  # hardcoded passwords in tests
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
