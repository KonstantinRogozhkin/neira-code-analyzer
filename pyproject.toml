[project]
name = "neira-code-analyzer"
version = "0.1.0"
description = "MCP server for Neira Code Analyzer - advanced codebase analysis with professional templates"
authors = [
    { name = "Olivier D'Ancona", email = "olivier.dancona@master.hes-so.ch" },
]
dependencies = [
    "mcp>=1.9.0",
    "httpx>=0.28.1",
    "colorlog>=6.9.0",
    "code2prompt-rs>=3.2.1",
    # Neira API library (currently using google-genai as backend)
    "google-genai>=1.19.0",
    "python-dotenv>=1.0.0",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/neira_code_analyzer"]
