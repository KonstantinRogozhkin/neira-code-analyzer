[project]
name = "neira-code-analyzer"
version = "0.1.0"
description = "MCP server for Neira Code Analyzer - advanced codebase analysis with professional templates"
authors = [
    { name = "Olivier D'Ancona", email = "olivier.dancona@master.hes-so.ch" },
]
dependencies = [
    "mcp>=1.9.0",
    "httpx>=0.28.1",
    "colorlog>=6.9.0",
    "code2prompt-rs>=3.2.1",
    # Neira API library (currently using google-genai as backend)
    "google-genai>=1.19.0",
    "python-dotenv>=1.0.0",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.rye.scripts]
# ИСПРАВЛЕНО: Центральная команда запуска для устранения дублирования
serve = "python -m src.neira_code_analyzer.main"
debug = "python -m src.neira_code_analyzer.main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/neira_code_analyzer"]

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "responses>=0.25.7",
]
