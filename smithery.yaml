# Smithery.ai configuration
startCommand:
  type: stdio
  configSchema: {}
  commandFunction: |
    (config) => ({
      command: "uv",
      args: ["run", "python", "-m", "src.neira_code_analyzer.main"],
      env: {
        "GOOGLE_AI_API_KEY": process.env.GOOGLE_AI_API_KEY
      }
    })


# Optional build configurations
build:
  dockerfile: Dockerfile
  dockerBuildPath: .
