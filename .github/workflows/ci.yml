name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true  # Останавливаем сборку при первой ошибке
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        uv sync --all-extras --dev
    
    - name: Lint with Ruff
      run: |
        uv run ruff check src/ tests/ --output-format=github
    
    - name: Format check with Ruff
      run: |
        uv run ruff format src/ tests/ --check
    
    - name: Type check with mypy
      run: |
        uv run mypy src/ --ignore-missing-imports
      continue-on-error: true  # Временно разрешаем ошибки типизации
    
    - name: Test with pytest
      run: |
        uv run pytest tests/ -v --tb=short --cov=src/neira_code_analyzer --cov-report=xml --cov-report=term-missing --cov-fail-under=34
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false  # Не ломаем сборку из-за проблем с Codecov
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    
    - name: Install dependencies
      run: uv sync --dev
    
    - name: Security audit with pip-audit
      run: |
        uv run pip-audit --desc --output json --outfile audit-results.json
      continue-on-error: true
    
    - name: Upload security results
      uses: actions/upload-artifact@v4
      with:
        name: security-audit
        path: audit-results.json
        retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    
    - name: Build package
      run: |
        uv build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7 